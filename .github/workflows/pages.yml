name: Publish handbook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install MkDocs dependencies
        run: pip install -r requirements.txt

      - name: Install Pandoc and XeLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Make build scripts executable
        run: chmod +x scripts/build-web.sh scripts/build-pdf.sh

      - name: Build MkDocs site
        run: ./scripts/build-web.sh

      - name: Build PDF
        run: ./scripts/build-pdf.sh

      - name: Add PDF to published site
        run: |
          mkdir -p dist/site/downloads
          cp dist/UCM-Competitive-Programming-Handbook.pdf \
            dist/site/downloads/UCM-Competitive-Programming-Handbook.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: ucm-handbook-pdf
          path: dist/UCM-Competitive-Programming-Handbook.pdf
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
