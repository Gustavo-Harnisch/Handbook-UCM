site_name: UCM Competitive Programming Handbook
site_description: Algoritmos, estructuras de datos y técnicas para programación competitiva
site_author: UCM Competitive Programming
site_url: https://gustavo-harnisch.github.io/Handbook-UCM/

docs_dir: content
site_dir: dist/site

repo_name: Gustavo-Harnisch/Handbook-UCM
repo_url: https://github.com/Gustavo-Harnisch/Handbook-UCM

theme:
  name: material
  language: es
  icon:
    repo: fontawesome/brands/github
    logo: material/code-braces
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

extra_css:
  - assets/stylesheets/extra.css

copyright: Hecho para aprender, practicar y compartir programación competitiva.

plugins:
  - search:
      lang: es

